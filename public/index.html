<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Architecture Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- VRButton (local fallback for broken CDN) -->
  <script src="./VRButton.js"></script>
  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  
  <script>
    // Global error listener to display crashes directly on screen (useful for VR headsets)
    window.onerror = function(message, source, lineno, colno, error) {
      const div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '0';
      div.style.left = '0';
      div.style.width = '100%';
      div.style.backgroundColor = '#fee2e2';
      div.style.color = '#991b1b';
      div.style.padding = '16px';
      div.style.zIndex = '999999';
      div.style.borderBottom = '2px solid #ef4444';
      div.style.fontFamily = 'monospace';
      div.style.fontSize = '14px';
      div.style.whiteSpace = 'pre-wrap';
      div.innerHTML = '<strong>Erreur JavaScript :</strong> ' + message + '<br>Ligne: ' + lineno + ':' + colno + '<br>Fichier: ' + source;
      document.body.appendChild(div);
      return false;
    };
  </script>

  <style>
    /* Prevent scrolling when in VR mode */
    .vr-active { overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="./main.js"></script>
</body>
</html>
